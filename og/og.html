<!doctype html>
<!-- Source for public/og.png. Render with `pnpm og` (headless Chrome, 1200×630). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Geist Pixel";
        src: url("../src/assets/fonts/GeistPixel-Square.woff2") format("woff2");
        font-weight: 500;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        /* 1 bot unit, matching Bot.tsx geometry */
        --u: 22px;
        --body: #2d2c2d;
        position: relative;
        background: #0c0c0e;
        color: #ececee;
        font:
          500 24px/1.2 "Geist Pixel",
          monospace;
        -webkit-font-smoothing: antialiased;
      }

      /* Backdrop: faint grid fading out from the bot, plus LED-tinted glow */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.05) 1px, transparent 1px);
        background-size: 44px 44px;
        background-position: -1px -1px;
        mask-image: radial-gradient(ellipse 60% 75% at 74% 50%, #000 10%, transparent 75%);
      }

      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 64% 30%, rgb(255 42 42 / 0.16), transparent 30%),
          radial-gradient(circle at 76% 24%, rgb(42 255 74 / 0.12), transparent 28%),
          radial-gradient(circle at 86% 32%, rgb(42 107 255 / 0.2), transparent 32%),
          radial-gradient(ellipse 50% 60% at 76% 55%, rgb(255 255 255 / 0.06), transparent 70%);
      }

      /* Copy */
      .copy {
        position: absolute;
        left: 80px;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        letter-spacing: 0.04em;
        color: rgb(236 236 238 / 0.5);
      }

      .eyebrow i {
        width: 10px;
        height: 10px;
        background: #2aff4a;
        box-shadow: 0 0 12px #2aff4a;
      }

      h1 {
        font-size: 152px;
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.02em;
        margin-left: -6px;
      }

      .tagline {
        font-size: 34px;
        line-height: 1.3;
        color: rgb(236 236 238 / 0.62);
      }

      .chips {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .chips span {
        padding: 10px 14px;
        font-size: 18px;
        color: rgb(236 236 238 / 0.72);
        background: rgb(255 255 255 / 0.04);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
        border-radius: 8px;
      }

      /* Bot: two CSS boxes (body + side ears), same proportions as Bot.tsx */
      .stage {
        position: absolute;
        left: 850px;
        top: 300px;
        perspective: 1600px;
      }

      .bot {
        position: absolute;
        transform-style: preserve-3d;
        transform: rotateX(-12deg) rotateY(24deg);
      }

      .box {
        position: absolute;
        transform-style: preserve-3d;
      }

      .face {
        position: absolute;
        left: calc(var(--w) * var(--u) / -2);
        top: calc(var(--h) * var(--u) / -2);
        width: calc(var(--w) * var(--u));
        height: calc(var(--h) * var(--u));
        background: var(--body);
        border-radius: 4px;
        backface-visibility: hidden;
      }

      .f {
        transform: translateZ(calc(var(--d) * var(--u) / 2));
        background: linear-gradient(160deg, #3a393b, #2a292a 60%, #232223);
      }
      .bk {
        transform: rotateY(180deg) translateZ(calc(var(--d) * var(--u) / 2));
      }
      .l,
      .r {
        width: calc(var(--d) * var(--u));
        left: calc(var(--d) * var(--u) / -2);
      }
      .l {
        transform: rotateY(-90deg) translateZ(calc(var(--w) * var(--u) / 2));
        background: linear-gradient(90deg, #1a191a, #222122);
      }
      .r {
        transform: rotateY(90deg) translateZ(calc(var(--w) * var(--u) / 2));
        background: #161516;
      }
      .t,
      .b {
        height: calc(var(--d) * var(--u));
        top: calc(var(--d) * var(--u) / -2);
      }
      .t {
        transform: rotateX(90deg) translateZ(calc(var(--h) * var(--u) / 2));
        background: linear-gradient(0deg, #444345, #39383a);
      }
      .b {
        transform: rotateX(-90deg) translateZ(calc(var(--h) * var(--u) / 2));
        background: #111;
      }

      .body-box {
        --w: 15.8;
        --h: 15.8;
        --d: 12;
      }
      .ears {
        --w: 17.7;
        --h: 14;
        --d: 11;
      }

      /* Front-face details, positioned in bot units from the face's top-left */
      .screen {
        position: absolute;
        left: calc(0.8 * var(--u));
        top: calc(4.4 * var(--u));
        width: calc(14.2 * var(--u));
        height: calc(9.8 * var(--u));
        border-radius: 3px;
        background: linear-gradient(150deg, rgb(255 255 255 / 0.1), transparent 38%), #020203;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.05);
      }

      .eye {
        position: absolute;
        display: grid;
        grid-template-columns: repeat(4, 19px);
        grid-auto-rows: 19px;
        transform: translate(-50%, -50%);
        top: calc(7.9 * var(--u) - 4.4 * var(--u) + 0.95 * var(--u));
        filter: drop-shadow(0 0 6px rgb(255 255 255 / 0.55));
      }
      .eye.le {
        left: calc(7.1 * var(--u) - 2.58 * var(--u));
      }
      .eye.re {
        left: calc(7.1 * var(--u) + 2.65 * var(--u));
      }
      .eye i.on {
        background: #f2f2f2;
      }

      .led {
        position: absolute;
        top: calc(7.9 * var(--u) - 6.2 * var(--u));
        width: calc(1.75 * var(--u));
        height: calc(1.75 * var(--u));
        transform: translate(-50%, -50%);
        background: #000;
        display: grid;
        place-items: center;
      }
      .led i {
        width: calc(1.1 * var(--u));
        height: calc(1.1 * var(--u));
        background: var(--c);
        box-shadow:
          0 0 6px var(--c),
          0 0 22px var(--c),
          0 0 56px var(--c),
          0 0 120px color-mix(in srgb, var(--c) 60%, transparent);
      }

      .shadow {
        position: absolute;
        left: 850px;
        top: 540px;
        width: 420px;
        height: 60px;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, rgb(0 0 0 / 0.9), transparent 70%);
        filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="shadow"></div>

    <div class="copy">
      <div class="eyebrow"><i></i>lilpix.dhrv.pw</div>
      <h1>lilpix</h1>
      <p class="tagline">A tiny 3D robot<br />with a pixel face.</p>
      <div class="chips">
        <span>15 expressions</span>
        <span>RGB LEDs</span>
        <span>9 backdrops</span>
      </div>
    </div>

    <div class="stage">
      <div class="bot">
        <div class="box ears">
          <div class="face f"></div>
          <div class="face bk"></div>
          <div class="face l"></div>
          <div class="face r"></div>
          <div class="face t"></div>
          <div class="face b"></div>
        </div>
        <div class="box body-box">
          <div class="face f" id="front">
            <div class="led" style="--c: #ff2a2a; left: calc(7.9 * var(--u) - 6.16 * var(--u))">
              <i></i>
            </div>
            <div class="led" style="--c: #2aff4a; left: calc(7.9 * var(--u) - 3.5 * var(--u))">
              <i></i>
            </div>
            <div class="led" style="--c: #2a6bff; left: calc(7.9 * var(--u) - 0.88 * var(--u))">
              <i></i>
            </div>
            <div class="screen">
              <div class="eye le"></div>
              <div class="eye re"></div>
            </div>
          </div>
          <div class="face bk"></div>
          <div class="face l"></div>
          <div class="face r"></div>
          <div class="face t"></div>
          <div class="face b"></div>
        </div>
      </div>
    </div>

    <script>
      // "happy" from src/expressions.ts
      const happy = [".##.", "#..#", "#..#"];
      for (const eye of document.querySelectorAll(".eye")) {
        for (const ch of happy.join("")) {
          const px = document.createElement("i");
          if (ch === "#") px.className = "on";
          eye.append(px);
        }
      }
    </script>
  </body>
</html>
